[project]
name = "marketmaker"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "PyYAML>=6,<7", "jsonschema>=4.23,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
marketmaker = "marketmaker.app:main"
agentskills-marketmaker = "marketmaker.app:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "packaging>=26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
